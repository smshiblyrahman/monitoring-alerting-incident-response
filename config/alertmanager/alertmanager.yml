global:
  resolve_timeout: 30s

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 1m
  receiver: 'default-webhook-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-remediation-receiver'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-receiver'

receivers:
  - name: 'default-webhook-receiver'
    webhook_configs:
      - url: 'http://remediation-webhook:5001/webhook/alertmanager'
        send_resolved: true
        http_config:
          bearer_token: 'selise-incident-secret-token'

  - name: 'critical-remediation-receiver'
    webhook_configs:
      - url: 'http://remediation-webhook:5001/webhook/alertmanager'
        send_resolved: true
        http_config:
          bearer_token: 'selise-incident-secret-token'

  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://remediation-webhook:5001/webhook/alertmanager'
        send_resolved: true
        http_config:
          bearer_token: 'selise-incident-secret-token'
