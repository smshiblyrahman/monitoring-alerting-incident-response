apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-operator
  namespace: monitoring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-remediator
  namespace: monitoring-system
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-operator-binding
  namespace: monitoring-system
subjects:
  - kind: ServiceAccount
    name: remediation-operator
    namespace: monitoring-system
roleRef:
  kind: Role
  name: pod-remediator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-webhook
  namespace: monitoring-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-webhook
  template:
    metadata:
      labels:
        app: remediation-webhook
    spec:
      serviceAccountName: remediation-operator
      containers:
        - name: remediation-webhook
          image: selise/remediation-webhook:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: APP_SERVICE_URL
              value: "http://order-service:8000"
            - name: WEBHOOK_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remediation-secret
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-webhook
  namespace: monitoring-system
spec:
  ports:
    - port: 5001
      targetPort: 5001
      name: http
  selector:
    app: remediation-webhook
